services:
  - type: web
    name: neuroscan-ai
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn backend.app:app --workers 1 --timeout 180"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: LIGHTWEIGHT_MODE
        value: "1"
