services:
  - type: web
    name: brain-tumor-web-app
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 1 --threads 1 --timeout 180"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LIGHTWEIGHT_MODE
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
      - key: CUDA_VISIBLE_DEVICES
        value: "-1"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
